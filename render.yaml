services:
  - type: web
    name: tuki-notification-worker
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node worker.js
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_DATABASE_URL
        value: https://livelocation-afb04-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
